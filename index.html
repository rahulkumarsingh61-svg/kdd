<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni AI Voice Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-top: 12px;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    /* Main Orb / Visualizer */
    .orb-container {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .orb {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #818cf8, #4f46e5);
      box-shadow: 0 0 35px rgba(99, 102, 241, 0.55);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .orb.speaking {
      animation: pulse-speaking 1s infinite alternate;
    }

    .orb.listening {
      background: radial-gradient(circle, #f87171, #dc2626);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.6);
      animation: pulse-listening 0.8s infinite alternate;
    }

    @keyframes pulse-speaking {
      0% { transform: scale(0.95); box-shadow: 0 0 25px rgba(99, 102, 241, 0.4); }
      100% { transform: scale(1.15); box-shadow: 0 0 50px rgba(99, 102, 241, 0.8); }
    }

    @keyframes pulse-listening {
      0% { transform: scale(0.95); box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
      100% { transform: scale(1.18); box-shadow: 0 0 50px rgba(239, 68, 68, 0.85); }
    }

    /* Conversation Area */
    .chat-container {
      width: 100%;
      max-width: 680px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 18px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.98rem;
      word-wrap: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: #4f46e5;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bubble.omni {
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    /* Input Controls */
    .controls {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 28px;
    }

    .controls input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 1rem;
      padding: 8px 12px;
    }

    .btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.2s, transform 0.15s;
    }

    .btn:active {
      transform: scale(0.92);
    }

    .btn-mic {
      background: #334155;
      color: #f8fafc;
    }

    .btn-mic.active {
      background: #ef4444;
    }

    .btn-send {
      background: #6366f1;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Omni AI</h1>
    <p class="subtitle">Created by Vedant • Full Voice & Web Assistant</p>
  </header>

  <div class="orb-container">
    <div id="orb" class="orb"></div>
  </div>

  <div class="chat-container" id="chat">
    <div class="bubble omni">Hello Vedant! Omni is ready. Type or tap the microphone to speak.</div>
  </div>

  <div class="controls">
    <button id="mic-btn" class="btn btn-mic" onclick="toggleVoice()" title="Voice input">🎤</button>
    <input type="text" id="user-input" placeholder="Say or type something..." onkeydown="handleKey(event)">
    <button class="btn btn-send" onclick="send()" title="Send">➤</button>
  </div>

  <script>
    const OPENROUTER_API_KEY = "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";

    const chat = document.getElementById("chat");
    const input = document.getElementById("user-input");
    const orb = document.getElementById("orb");
    const micBtn = document.getElementById("mic-btn");

    function append(text, sender) {
      const b = document.createElement("div");
      b.className = `bubble ${sender}`;
      b.textContent = text;
      chat.appendChild(b);
      chat.scrollTop = chat.scrollHeight;
      return b;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.onstart = () => orb.className = "orb speaking";
      u.onend = () => orb.className = "orb";
      u.onerror = () => orb.className = "orb";
      window.speechSynthesis.speak(u);
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;

      append(text, "user");
      input.value = "";

      const clean = text.toLowerCase();
      if (clean.includes("who created you")) {
        const reply = "I was created by Vedant.";
        append(reply, "omni");
        speak(reply);
        return;
      }
      if (clean.includes("who are you")) {
        const reply = "I am Omni, your 24/7 AI companion.";
        append(reply, "omni");
        speak(reply);
        return;
      }

      const thinking = append("...", "omni");

      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "meta-llama/llama-3.2-3b-instruct:free",
            messages: [
              {
                role: "system",
                content: "Your name is Omni, created by Vedant. Be concise, intelligent, friendly, and speak naturally in 1-2 short sentences without markdown symbols."
              },
              { role: "user", content: text }
            ]
          })
        });

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || "I didn't catch that.";
        thinking.textContent = reply;
        speak(reply);
      } catch (err) {
        thinking.textContent = "Connection error. Please try again.";
        orb.className = "orb";
      }
    }

    function handleKey(e) {
      if (e.key === "Enter") send();
    }

    // Speech-to-text
    let rec = null;
    let listening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      rec = new SR();
      rec.continuous = false;
      rec.lang = 'en-US';

      rec.onstart = () => {
        listening = true;
        micBtn.classList.add("active");
        orb.className = "orb listening";
      };

      rec.onresult = (e) => {
        input.value = e.results[0][0].transcript;
        send();
      };

      rec.onend = () => {
        listening = false;
        micBtn.classList.remove("active");
        if (!orb.classList.contains("speaking")) orb.className = "orb";
      };

      rec.onerror = () => {
        listening = false;
        micBtn.classList.remove("active");
        orb.className = "orb";
      };
    }

    function toggleVoice() {
      if (!rec) {
        alert("Microphone input requires Chrome browser.");
        return;
      }
      if (listening) {
        rec.stop();
      } else {
        rec.start();
      }
    }
  </script>
</body>
</html>
