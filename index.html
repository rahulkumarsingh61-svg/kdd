<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAI Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background-color: #0b0f19;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.45);
    }

    .brand-meta h1 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .badge.locked {
      background: #382914;
      color: #f59e0b;
      border: 1px solid #78350f;
    }

    .badge.unlocked {
      background: #064e3b;
      color: #10b981;
      border: 1px solid #047857;
    }

    .brand-meta p {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select.model-picker {
      background: #111827;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    button.btn-clear {
      background: #111827;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-clear:hover {
      background: #1f2937;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
      overflow-y: auto;
    }

    .chat-container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message-row {
      display: flex;
      gap: 12px;
      width: 100%;
      align-items: flex-start;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .avatar.ai {
      background: #7c3aed;
      color: #fff;
    }

    .avatar.user-avatar {
      background: #2563eb;
      color: #fff;
    }

    .card-body {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 18px;
      max-width: 78%;
      line-height: 1.5;
      font-size: 0.94rem;
      word-wrap: break-word;
    }

    .message-row.user .card-body {
      background: #2563eb;
      color: #fff;
      border: none;
    }

    .card-title {
      font-weight: 600;
      font-size: 0.96rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f8fafc;
    }

    footer {
      padding: 16px 20px 24px;
      display: flex;
      justify-content: center;
      background-color: #0b0f19;
    }

    .pill-input {
      width: 100%;
      max-width: 820px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      display: flex;
      align-items: center;
      padding: 6px 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .pill-input input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 0.95rem;
      padding: 10px 14px;
    }

    .pill-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.2s, color 0.2s;
    }

    .pill-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.05);
    }

    .pill-btn.recording {
      background: #dc2626;
      color: #ffffff;
      animation: pulse-mic 1s infinite alternate;
    }

    .pill-btn.send-btn {
      background: #4f46e5;
      color: #ffffff;
    }

    .pill-btn.send-btn:hover {
      background: #4338ca;
    }

    @keyframes pulse-mic {
      0% { transform: scale(1); }
      100% { transform: scale(1.12); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🤖</div>
      <div class="brand-meta">
        <h1>OmniAI Studio <span id="status-badge" class="badge locked">Locked</span></h1>
        <p id="status-sub">Say or type "Hello Omni" to unlock</p>
      </div>
    </div>

    <div class="header-actions">
      <select id="model-select" class="model-picker">
        <option value="openrouter/auto" selected>Free Auto-Router (Always Online)</option>
        <option value="qwen/qwen-2.5-7b-instruct:free">Qwen 2.5 7B Free</option>
      </select>
      <button class="btn-clear" onclick="clearConversation()">Clear</button>
    </div>
  </header>

  <main>
    <div class="chat-container" id="chat-stream">
      <div class="message-row">
        <div class="avatar ai">AI</div>
        <div class="card-body">
          <div class="card-title">Security Check Required 🔒</div>
          Welcome to OmniAI Studio! This assistant is currently locked. To activate it and start chatting in any language, please type or speak <strong>"Hello Omni"</strong>.
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="pill-input">
      <button id="mic-btn" class="pill-btn" onclick="toggleVoice()" title="Microphone">🎤</button>
      <input type="text" id="user-input" placeholder="Type 'Hello Omni' to activate..." onkeydown="handleKey(event)">
      <button class="pill-btn send-btn" onclick="sendMessage()" title="Send">➤</button>
    </div>
  </footer>

  <script>
    const OPENROUTER_API_KEY = "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";

    let isLocked = true;
    let awaitingName = false;
    let userName = "";

    const chatStream = document.getElementById("chat-stream");
    const userInput = document.getElementById("user-input");
    const statusBadge = document.getElementById("status-badge");
    const statusSub = document.getElementById("status-sub");
    const micBtn = document.getElementById("mic-btn");
    const modelSelect = document.getElementById("model-select");

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(u);
    }

    function addMessage(text, sender, title = null) {
      const row = document.createElement("div");
      row.className = `message-row ${sender}`;

      const avatar = document.createElement("div");
      avatar.className = `avatar ${sender === "user" ? "user-avatar" : "ai"}`;
      avatar.textContent = sender === "user" ? "U" : "AI";

      const card = document.createElement("div");
      card.className = "card-body";

      if (title) {
        const titleEl = document.createElement("div");
        titleEl.className = "card-title";
        titleEl.innerHTML = title;
        card.appendChild(titleEl);
      }

      const textEl = document.createElement("div");
      textEl.textContent = text;
      card.appendChild(textEl);

      if (sender === "user") {
        row.appendChild(card);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(card);
      }

      chatStream.appendChild(row);
      chatStream.parentElement.scrollTop = chatStream.parentElement.scrollHeight;
      return textEl;
    }

    function clearConversation() {
      chatStream.innerHTML = "";
      if (isLocked) {
        addMessage("Welcome to OmniAI Studio! This assistant is currently locked. To activate it and start chatting in any language, please type or speak 'Hello Omni'.", "ai", "Security Check Required 🔒");
      } else {
        addMessage(`Conversation cleared. How can I assist you${userName ? ', ' + userName : ''}?`, "ai");
      }
    }

    async function requestAI(promptText, thinkingEl) {
      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.origin,
            "X-Title": "OmniAI Studio"
          },
          body: JSON.stringify({
            model: modelSelect.value,
            messages: [
              {
                role: "system",
                content: `Your name is Omni. You are speaking with ${userName || 'the user'}. Provide concise, clear, and direct answers in 1 to 2 sentences without markdown formatting.`
              },
              { role: "user", content: promptText }
            ]
          })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          const errMsg = data.error?.message || `HTTP ${response.status}: Failed to get answer.`;
          thinkingEl.textContent = `API Notice: ${errMsg}`;
          return;
        }

        const reply = data.choices?.[0]?.message?.content || "No response received.";
        thinkingEl.textContent = reply;
        speak(reply);
      } catch (err) {
        thinkingEl.textContent = "Network error: Unable to reach OpenRouter.";
      }
    }

    async function sendMessage() {
      const rawText = userInput.value.trim();
      if (!rawText) return;

      addMessage(rawText, "user");
      userInput.value = "";

      const clean = rawText.toLowerCase().replace(/[^a-zA-Z0-9 ]/g, "").trim();

      // Lock handling
      if (isLocked) {
        if (clean.includes("hello omni")) {
          isLocked = false;
          awaitingName = true;
          statusBadge.textContent = "Unlocked";
          statusBadge.className = "badge unlocked";
          statusSub.textContent = "OmniAI Studio is active and ready";
          userInput.placeholder = "Please enter your name...";
          
          const unlockReply = "Omni unlocked! May I know your name?";
          addMessage(unlockReply, "ai", "Access Granted 🔓");
          speak(unlockReply);
        } else {
          const lockedWarning = "Please say or type 'Hello Omni' first to unlock the assistant.";
          addMessage(lockedWarning, "ai");
          speak(lockedWarning);
        }
        return;
      }

      // Name capture handling (checks if user asked a question instead of giving a name)
      if (awaitingName) {
        const isQuestion = rawText.includes("?") || /^(who|what|where|when|why|how|is|are|can|tell)\b/i.test(rawText.trim());
        
        if (isQuestion) {
          awaitingName = false;
          userName = "User";
          userInput.placeholder = "Ask Omni anything...";
          const thinkingEl = addMessage("Thinking...", "ai");
          await requestAI(rawText, thinkingEl);
          return;
        }

        let extracted = rawText.replace(/^(hello|hi|hey|my name is|i am|this is|call me)\s*/gi, "").trim();
        userName = extracted || rawText;
        awaitingName = false;
        userInput.placeholder = "Ask Omni anything...";

        const greeting = `Hello ${userName}, how can I help you today?`;
        addMessage(greeting, "ai");
        speak(greeting);
        return;
      }

      // Pre-set Persona answers
      if (clean.includes("who created you")) {
        const rep = "I was created by Rahul.";
        addMessage(rep, "ai");
        speak(rep);
        return;
      }
      if (clean.includes("who are you")) {
        const rep = "I am Omni, your AI studio assistant.";
        addMessage(rep, "ai");
        speak(rep);
        return;
      }

      // General query call
      const thinkingEl = addMessage("Thinking...", "ai");
      await requestAI(rawText, thinkingEl);
    }

    function handleKey(e) {
      if (e.key === "Enter") sendMessage();
    }

    let recognition = null;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("recording");
      };

      recognition.onresult = (e) => {
        userInput.value = e.results[0][0].transcript;
        sendMessage();
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("recording");
      };

      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove("recording");
      };
    }

    function toggleVoice() {
      if (!recognition) {
        alert("Speech recognition is supported in Google Chrome.");
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }
  </script>
</body>
</html>
