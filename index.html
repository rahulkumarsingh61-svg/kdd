<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    p {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    /* Floating Omni Button */
    #omni-launcher {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #6366f1;
      color: #ffffff;
      border: none;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
      z-index: 9999;
    }

    #omni-launcher:hover {
      transform: scale(1.08);
      background: #4f46e5;
    }

    /* Chat Widget Window */
    #omni-widget {
      position: fixed;
      bottom: 96px;
      right: 24px;
      width: 380px;
      max-width: calc(100vw - 48px);
      height: 520px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 9999;
      transition: opacity 0.2s, transform 0.2s;
    }

    #omni-widget.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
    }

    .widget-header {
      background: #0f172a;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .widget-title {
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #f8fafc;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #6366f1;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .msg.omni {
      align-self: flex-start;
      background: #334155;
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
    }

    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #0f172a;
      border-top: 1px solid #334155;
    }

    .chat-input-bar input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input-bar input:focus {
      border-color: #6366f1;
    }

    .btn-action {
      background: #334155;
      color: #f8fafc;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: #475569;
    }

    .btn-action.listening {
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }

    .btn-send {
      background: #6366f1;
    }

    .btn-send:hover {
      background: #4f46e5;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome to My Site</h1>
    <p>Click the floating button on the bottom right to talk with Omni.</p>
  </div>

  <!-- Floating Launcher -->
  <button id="omni-launcher" onclick="toggleWidget()">💬</button>

  <!-- Omni Widget -->
  <div id="omni-widget" class="hidden">
    <div class="widget-header">
      <div class="widget-title">
        <span class="status-dot"></span>
        Omni AI
      </div>
      <button class="close-btn" onclick="toggleWidget()">✕</button>
    </div>

    <div class="chat-messages" id="messages-container">
      <div class="msg omni">Hello! I am Omni, created by Vedant. How can I help you today?</div>
    </div>

    <div class="chat-input-bar">
      <input type="text" id="user-input" placeholder="Ask Omni..." onkeydown="handleKey(event)">
      <button id="mic-btn" class="btn-action" onclick="toggleVoice()" title="Speak">🎤</button>
      <button class="btn-action btn-send" onclick="sendMessage()" title="Send">➤</button>
    </div>
  </div>

  <script>
    const OPENROUTER_API_KEY = "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";

    const widget = document.getElementById("omni-widget");
    const messagesContainer = document.getElementById("messages-container");
    const userInput = document.getElementById("user-input");
    const micBtn = document.getElementById("mic-btn");

    function toggleWidget() {
      widget.classList.toggle("hidden");
      if (!widget.classList.contains("hidden")) {
        userInput.focus();
      }
    }

    function appendMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;
      msgDiv.textContent = text;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return msgDiv;
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      userInput.value = "";

      const clean = text.toLowerCase();
      if (clean.includes("who created you")) {
        const reply = "I was created by Vedant.";
        appendMessage(reply, "omni");
        speakText(reply);
        return;
      }
      if (clean.includes("who are you")) {
        const reply = "I am Omni, your 24/7 AI assistant.";
        appendMessage(reply, "omni");
        speakText(reply);
        return;
      }

      const thinkingMsg = appendMessage("Thinking...", "omni");

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "meta-llama/llama-3.2-3b-instruct:free",
            messages: [
              {
                role: "system",
                content: "Your name is Omni, created by Vedant. Answer questions clearly, accurately, and politely in 1 to 2 sentences. Do not use markdown formatting."
              },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || "Sorry, I could not generate a response.";
        thinkingMsg.textContent = reply;
        speakText(reply);
      } catch (err) {
        thinkingMsg.textContent = "Error connecting to AI service.";
      }
    }

    function handleKey(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    }

    // Voice recognition
    let recognition = null;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        sendMessage();
      };

      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove("listening");
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("listening");
      };
    }

    function toggleVoice() {
      if (!recognition) {
        alert("Speech recognition is not supported in this browser. Please use Chrome.");
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }
  </script>
</body>
</html>
